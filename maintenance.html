<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Under Maintenance</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 50px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1 {
    color: #2d2d3a;
    font-size: 26px;
    margin-bottom: 14px;
  }

  p {
    color: #6b6b7b;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 2px;
    margin: 24px auto;
  }

  .footer-note {
    font-size: 13px;
    color: #a0a0b0;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">🛠️</div>
    <h1>We'll Be Right Back</h1>
    <p>This site is currently undergoing scheduled maintenance.</p>
    <p>We're working to bring it back online as soon as possible. Thank you for your patience.</p>
    <div class="divider"></div>
    <p class="footer-note">Please check back shortly.</p>
  </div>

</body>
</html>
